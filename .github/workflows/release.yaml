name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.0.1)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout release tag
        run: |
          git fetch --tags
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "Error: No tag provided in release event or workflow_dispatch input"
            exit 1
          fi
          echo "Checking out tag $TAG"
          git checkout "$TAG"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
          registry-url: 'https://registry.npmjs.org'

      - name: Activate npm from packageManager field
        run: |
          corepack enable npm
          corepack install
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Set package version from release tag
        env:
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          echo "Setting package version to $VERSION (from tag $TAG)"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # engines.npm pins the npm that contributors use to write package-lock.json.
      # It is not a requirement for consumers, so drop it from the published manifest
      # or every install with another npm would print an EBADENGINE warning.
      - name: Remove contributor-only npm pin from published manifest
        run: npm pkg delete engines.npm

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
